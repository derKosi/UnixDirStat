name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build binaries
        env:
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME}"
          # Platform list: OS/ARCH/Binary-suffix
          TARGETS="
            linux/amd64/
            linux/arm64/
            darwin/amd64/
            darwin/arm64/
            windows/amd64/.exe
          "
          for target in $TARGETS; do
            os=$(echo "$target" | cut -d/ -f1)
            arch=$(echo "$target" | cut -d/ -f2)
            suffix=$(echo "$target" | cut -d/ -f3)
            binary="unixdirstat-${os}-${arch}${suffix}"
            echo "Building $binary..."
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$binary" .
            tar czf "${binary}.tar.gz" "$binary"
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            unixdirstat-*.tar.gz
